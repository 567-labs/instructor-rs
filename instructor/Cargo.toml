[package]
name = "instructor-ai"
version = "0.1.8"
edition = "2021"
authors = ["Ivan Leo <ivanleomk@gmail.com>"]
description = "instructor-ai is a simple crate that allows for users to do validated structured outputs"
readme = "../README.md"
homepage = "https://rust.useinstructor.com"
repository = "https://github.com/instructor-ai/instructor-rs"
license = "MIT OR Apache-2.0"

[package.metadata]
changelog = "CHANGELOG.md"

[dependencies]
async-stream = "0.3"
base64 = "0.22"
futures-util = "0.3"
jiter = "0.19"
lru = "0.16"
minijinja = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "blocking", "rustls-tls"] }
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
instruct-macros = { path = "../instruct-macros", version = "0.*" }
openai-api-rs = "4.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
instruct-macros-types = { path = "../instruct-macros-types", version = "0.*" }

[lib]
name = "instructor_ai"
path = "src/lib.rs"

[dev-dependencies]
mockito = "1"
