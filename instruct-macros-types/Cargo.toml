[package]
name = "instruct-macros-types"
version = "0.1.8"
edition = "2021"
authors = ["Ivan Leo <ivanleomk@gmail.com>"]
description = "Schema and validation traits for Instructor response models"
readme = "README.md"
homepage = "https://rust.useinstructor.com"
repository = "https://github.com/567-labs/instructor-rs"
license = "MIT OR Apache-2.0"


[package.metadata]
changelog = "CHANGELOG.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"

[lib]
name = "instruct_macros_types"
path = "src/lib.rs"
