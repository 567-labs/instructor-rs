[package]
name = "instruct-macros"
version = "0.1.8"
edition = "2018"
authors = ["Ivan Leo <ivanleomk@gmail.com>"]
description = "Derive response models, typed previews, and decisions for Instructor"
readme = "README.md"
homepage = "https://rust.useinstructor.com"
repository = "https://github.com/567-labs/instructor-rs"
license = "MIT OR Apache-2.0"

[package.metadata]
changelog = "CHANGELOG.md"

[dev-dependencies]
serde_json = "1.0"
instruct-macros-types = { path = "../instruct-macros-types", version = "0.*" }

[dependencies]
proc-macro2 = "1.0.86"
proc-macro-crate = "3"
serde_derive_internals = "0.29"

[dependencies.syn]
version = "2.0.68"
features = ["full", "visit-mut"]

[dependencies.quote]
version = "1.0"

[lib]
proc-macro = true
